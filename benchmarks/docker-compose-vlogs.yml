version: "3"

services:
  vlogs:
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: "8GB"
    image: victoriametrics/victoria-logs:v1.49.0
    ports:
      - "9428:9428"
    command:
      - "--storageDataPath=/vlogs"
    volumes:
      - victorialogs-data:/vlogs

  logs-sender:
    image: golang:1.25-alpine
    deploy:
      resources:
        limits:
          memory: "2GB"
    working_dir: /workspace
    volumes:
      - ../:/workspace
      - ./dataset/:/dataset:ro
    command: go run ./benchmarks/cmd/logs-sender
    environment:
      BULK_URL: http://vlogs:9428/insert/elasticsearch/_bulk?_msg_field=request
      FILE_PATTERN: docs-*.log
      BULK_SIZE: 4096
      INDEX_NAME: logs-index
    depends_on:
      - vlogs

volumes:
  victorialogs-data:
