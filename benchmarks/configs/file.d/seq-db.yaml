pipeline-settings: &pipeline-settings
  settings:
    capacity: 32768
    max_event_size: 524288
    pool: low_memory

pipeline-input-settings: &pipeline-input-settings
  type: file
  workers_count: 4
  offsets_op: 'reset'
  persistence_mode: 'async'
  paths:
    include:
      - '/var/file.d/logs/docs-*.log'

pipeline-output-settings: &pipeline-output-settings
  type: elasticsearch
  index_format: logs-index
  connection_timeout: 20s
  batch_size: 4096
  workers_count: 256
  batch_flush_timeout: 5s

pipelines:
  seqdb:
    <<: *pipeline-settings

    input:
      <<: *pipeline-input-settings
      offsets_file: '/var/file.d/offsets/seqdb-offsets.yaml'

    output:
      <<: *pipeline-output-settings
      endpoints:
        - http://seq-db:9002/
