        app.kubernetes.io/version: "latest"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: release-name-seq-db
      containers:
        - name: seq-db
          image: "ghcr.io/ozontech/seq-db:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9002
              protocol: TCP
            - name: grpc
              containerPort: 9004
              protocol: TCP
            - name: debug
              containerPort: 9200
              protocol: TCP
