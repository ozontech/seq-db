apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: release-name-seq-db
  labels:
    helm.sh/chart: seq-db-0.1.0
    app.kubernetes.io/name: seq-db
    app.kubernetes.io/instance: release-name
