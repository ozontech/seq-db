apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "seq-db.fullname" . }}-mappings
  labels:
    app: "{{ template "seq-db.fullname" . }}"
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service | quote }}
    release: {{ .Release.Name | quote }}
data:
  mappings.yaml: |
    mapping-list:
{{ .Values.mapping.mapping_list | toYaml | indent 4 }}