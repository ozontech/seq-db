{{- if .Values.seqproxy.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "seq-proxy.serviceAccountName" . }}
  labels:
    {{- include "seq-proxy.labels" . | nindent 4 }}
  {{- with .Values.seqproxy.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.seqproxy.serviceAccount.automount }}
{{- end }}
