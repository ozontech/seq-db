{{- if .Values.sequi.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "seq-ui.serviceAccountName" . }}
  labels:
    {{- include "seq-ui.labels" . | nindent 4 }}
  {{- with .Values.sequi.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.sequi.serviceAccount.automount }}
{{- end }}
