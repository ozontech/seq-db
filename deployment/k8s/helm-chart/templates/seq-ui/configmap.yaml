{{- if .Values.sequi.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "seq-ui.fullname" . }}-config
  labels:
    app: "{{ template "seq-ui.fullname" . }}"
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service | quote }}
    release: {{ .Release.Name | quote }}
data:
  config.yaml: |
    server:
      http_addr: "0.0.0.0:5555"
      grpc_addr: "0.0.0.0:5556"
      debug_addr: "0.0.0.0:5557"
      cors:
        allowed_headers:
          - Content-Type
          - Authorization
        allowed_methods:
          - HEAD
          - GET
          - POST
          - PATCH
          - DELETE
        allowed_origins:
          - '*'
        max_age: 300  
    clients:
      seq_db_addrs:
        - {{ $.Release.Name }}-proxy.{{ $.Release.Namespace }}.svc.cluster.local.:9004
      seq_db_timeout: {{ .Values.sequi.config.clients.seq_db_timeout | default "15s" }}
      request_retries: {{ .Values.sequi.config.clients.request_retries | default 3 }}
    handlers:
      seq_api:
        max_search_limit: {{ .Values.sequi.config.handlers.seq_api.max_search_limit | default 1000 }}
        max_parallel_export_requests: {{ .Values.sequi.config.handlers.seq_api.max_parallel_export_requests | default 1 }}
        max_aggregations_per_request: {{ .Values.sequi.config.handlers.seq_api.max_aggregations_per_request | default 3 }}
{{- end }}
