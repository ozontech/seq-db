{{- if .Values.sequi.front.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "seq-ui-front.fullname" . }}-config
  labels:
    app: "{{ template "seq-ui-front.fullname" . }}"
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service | quote }}
    release: {{ .Release.Name | quote }}
data:
  config.json: |
    {
      'SEQ_UI_URL': {{ include "seq-ui.url" . | quote }}
    }
{{- end }}
